[project]
name = "eks-infra-cdk"
version = "0.1.0"
description = "AWS CDK app that provisions the EKS cluster (VPC, control plane, Fargate profiles, IRSA) for flask-cloud-api-v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "aws-cdk.lambda-layer-kubectl-v31>=2.1.0",
    "constructs>=10.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.uv]
package = false
