apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: my-cluster
  region: ap-northeast-1

vpc:
  subnets:
    private:
      ap-northeast-1c: { id:  subnet-0aae0f631d0bd26da }
      ap-northeast-1a: { id:  subnet-0a2fee30707b4b8d3 }
  clusterEndpoints:
    publicAccess:  true
    privateAccess: true

iam:
  withOIDC: true
fargateProfiles:
  - name: fp-default
    selectors:
      - namespace: default
      - namespace: kube-system
      - namespace: test-app

cloudwatch:
  clusterLogging:
    enableTypes: ["*"]
